<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solarwetter-Bericht für Deutschland</title>
<style>
:root {
  --bg: #f5f7fa; --card: #ffffff; --text: #1f2933; --muted: #6b7280; --border: #e5e7eb;
  --red: #d32f2f; --magenta: #c2185b; --yellow: #b8860b; --green: #2e7d32; --cyan: #00838f;
  --blue: #1565c0; --accent: #f0b429;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --border: #334155;
    --red: #f87171; --magenta: #f472b6; --yellow: #fbbf24; --green: #4ade80; --cyan: #22d3ee;
    --blue: #60a5fa;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45;
}
main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
header h1 { margin: 0 0 4px; font-size: 1.5rem; }
header p { margin: 0; color: var(--muted); }
button {
  font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); cursor: pointer;
}
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; margin-top: 16px;
}
.card h2 { font-size: 1.05rem; margin: 0 0 12px; }
.row { display: flex; gap: 12px; padding: 3px 0; flex-wrap: wrap; }
.label { min-width: 200px; color: var(--muted); }
.val { font-weight: 600; }
.red { color: var(--red); }
.magenta { color: var(--magenta); }
.yellow { color: var(--yellow); }
.green { color: var(--green); }
.cyan { color: var(--cyan); }
.gray { color: var(--muted); }
.bar { height: 14px; background: var(--border); border-radius: 7px; overflow: hidden; margin: 10px 0 4px; }
.bar > div { height: 100%; border-radius: 7px; }
.scale { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); }
.err { color: var(--red); }
.hint { color: var(--muted); font-size: .9rem; margin-top: 4px; }
.sub { font-size: .9rem; color: var(--yellow); font-weight: 600; margin: 14px 0 6px; }
.sub-plain { font-size: 1.05rem; color: var(--text); font-weight: 600; margin: 14px 0 6px; }
.legend { font-size: .88rem; color: var(--muted); white-space: pre-line; margin: 0; }
.tabs{margin:2px 0 6px}.tabs button{padding:3px 10px;margin-right:6px}.tabs .on{background:var(--accent);color:#1f2933;font-weight:700}
svg { width: 100%; height: auto; display: block; margin-top: 8px; }
svg text { fill: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Solarwetter-Bericht für Deutschland</h1>
      <p id="stamp"></p>
    </div>
    <button id="reload" type="button">Aktualisieren</button>
  </header>
  <div id="content"></div>
</main>

<script>
"use strict";

// ── Konfiguration ─────────────────────────────────────────────────
const KP_URLS = [
  "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json",
  "https://services.swpc.noaa.gov/json/planetary_k_index_1m.json",
];
const F107_URL = "https://services.swpc.noaa.gov/json/f107_cm_flux.json";
const SSN_OBS_URL = "https://services.swpc.noaa.gov/json/solar-cycle/observed-solar-cycle-indices.json";
const SSN_PRED_URL = "https://services.swpc.noaa.gov/json/solar-cycle/predicted-solar-cycle.json";
// GOES-Röntgenfluss (1-Minuten-Daten, 24 h). NOAA ordnet GOES-18 je nach Betriebszustand
// dem "primary"- oder "secondary"-Feed zu; deshalb werden beide geladen und nach
// dem Feld "satellite" ausgewählt.
const XRAY_URLS = [
  "https://services.swpc.noaa.gov/json/goes/secondary/xrays-1-day.json",
  "https://services.swpc.noaa.gov/json/goes/primary/xrays-1-day.json",
];
const XRAY_SATELLIT = 18;
const FLARE_URL = "https://services.swpc.noaa.gov/json/goes/primary/xray-flares-7-day.json";
const PLASMA_URL = "https://services.swpc.noaa.gov/products/solar-wind/plasma-2-hour.json";
const MAG_URL = "https://services.swpc.noaa.gov/products/solar-wind/mag-2-hour.json";
const PROTON_URL = "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-1-day.json";
const RANGES = { "6 h": ["6-hour", 6, 1], "24 h": ["1-day", 24, 3], "3 Tage": ["3-day", 72, 12] };
let xrayRange = "24 h";
const S = {};   // Kennwerte für die Zusammenfassung

const REGIONEN = [
  { name: "Norddeutschland (Hamburg)",  lat: 53.5 },
  { name: "Mitteldeutschland (Berlin)", lat: 52.5 },
  { name: "Süddeutschland (München)",   lat: 48.1 },
];

const TIME_KEYS  = ["time_tag", "time-tag", "year-month", "date", "month"];
const SSN_KEYS   = ["ssn", "SSN", "sunspot_number", "observed_ssn"];
const SMOOTH_KEYS = ["smoothed_ssn", "smoothed-ssn", "ssn_smoothed", "smooth_ssn"];
const PRED_KEYS  = ["predicted_ssn", "predicted-ssn", "ssn_predicted", "ssn_pred", "ssn"];

const MONATE_DE = ["Januar","Februar","März","April","Mai","Juni",
                   "Juli","August","September","Oktober","November","Dezember"];
const MONATE_KURZ = ["Jan","Feb","März","Apr","Mai","Juni","Juli","Aug","Sep","Okt","Nov","Dez"];

// ── Hilfsfunktionen ───────────────────────────────────────────────
const pad = n => String(n).padStart(2, "0");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function cssClass(f) {
  return f === "dyellow" ? "yellow" : (f || "");
}

function row(label, value, f) {
  const r = el("div", "row");
  r.append(el("span", "label", label), el("span", "val " + cssClass(f), value));
  return r;
}

function bar(pct, f) {
  const b = el("div", "bar");
  const d = el("div");
  d.style.width = (Math.min(Math.max(pct, 0), 1) * 100) + "%";
  const colorVar = { dyellow: "yellow", gray: "muted", white: "text" }[f] || f || "text";
  d.style.background = "var(--" + colorVar + ")";
  b.append(d);
  return b;
}

function scale(min, max) {
  const s = el("div", "scale");
  s.append(el("span", "", min), el("span", "", max));
  return s;
}

function getField(entry, ...keys) {
  for (const k of keys) {
    if (entry && entry[k] !== undefined && entry[k] !== null && entry[k] !== "") return entry[k];
  }
  return null;
}

async function fetchJson(url, versuche = 2) {
  for (let i = 1; ; i++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    try {
      const r = await fetch(url, { signal: ctrl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) {
      if (i >= versuche) throw e;
      await new Promise(res => setTimeout(res, 800));
    } finally {
      clearTimeout(timer);
    }
  }
}

// Kp-Wert: höhere Breiten brauchen einen niedrigeren Kp-Wert.
// Näherungsformel: Kp_min = (90 - Breitengrad) / 5.5
function minKp(lat) {
  return Number(((90 - lat) / 5.5).toFixed(1));
}

function kpFarbe(kp) {
  if (kp >= 7) return "red";
  if (kp >= 5) return "magenta";
  if (kp >= 4) return "yellow";
  return "green";
}

function kpStufe(kp) {
  if (kp >= 9) return "G5 - Extremer Magnetsturm";
  if (kp >= 8) return "G4 - Schwerer Magnetsturm";
  if (kp >= 7) return "G3 - Starker Magnetsturm";
  if (kp >= 6) return "G2 - Mäßiger Magnetsturm";
  if (kp >= 5) return "G1 - Geringer Magnetsturm";
  if (kp >= 4) return "Aktiv (erhöhte Aktivität)";
  if (kp >= 2) return "Leicht unruhig";
  return "Ruhig (Quiet)";
}

function fluxStufe(f) {
  if (f >= 300) return "Extrem hoch";
  if (f >= 200) return "Sehr hoch";
  if (f >= 150) return "Hoch";
  if (f >= 120) return "Erhöht";
  if (f >= 100) return "Moderat aktiv";
  if (f >= 80)  return "Leicht aktiv";
  return "Ruhig";
}

function fluxFarbe(f) {
  if (f >= 200) return "red";
  if (f >= 150) return "magenta";
  if (f >= 120) return "yellow";
  if (f >= 100) return "dyellow";
  if (f >= 80)  return "green";
  return "cyan";
}

function ssnNiveau(s) {
  if (s > 150) return "Sehr hohe Sonnenaktivität";
  if (s > 100) return "Hohe Sonnenaktivität";
  if (s > 50)  return "Moderate Sonnenaktivität";
  if (s > 20)  return "Niedrige Sonnenaktivität";
  return "Sehr ruhige Sonne";
}

function fmtSsn(val) {
  if (val === null || val === undefined || val === "") return null;
  const f = Number(val);
  if (Number.isNaN(f)) return String(val);
  if (f < 0) return null;
  return f.toFixed(1);
}

function verfuegbarAb(zeit) {
  const m = /^(\d{4})-(\d{2})/.exec(String(zeit));
  if (!m) return "ca. in 6 Monaten";
  let monat = Number(m[2]) + 6;
  const jahr = Number(m[1]) + Math.floor((monat - 1) / 12);
  monat = ((monat - 1) % 12) + 1;
  return `${MONATE_DE[monat - 1]} ${jahr}`;
}

function kpZeitfenster(zeit) {
  const s = String(zeit).replace("T", " ").replace("Z", "").slice(0, 19);
  const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(s);
  if (!m) return String(zeit);
  const start = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
  const end = start + 3 * 3600 * 1000;
  const fmt = ms => {
    const d = new Date(ms);
    return pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes());
  };
  return `${fmt(start)} - ${fmt(end)} UTC`;
}

function extrahiereKp(eintrag) {
  if (eintrag && typeof eintrag === "object" && !Array.isArray(eintrag)) {
    for (const k of ["kp_index", "Kp", "kp", "KP"]) {
      if (eintrag[k] !== undefined && eintrag[k] !== null) {
        return [parseFloat(eintrag[k]), eintrag.time_tag || eintrag["time-tag"] || "-"];
      }
    }
  } else if (Array.isArray(eintrag) && eintrag.length >= 2) {
    return [parseFloat(eintrag[1]), String(eintrag[0])];
  }
  return [null, null];
}

// Monatsanfang (UTC) aus "YYYY-MM..." Zeitstempel
function monatsDatum(entry) {
  const t = getField(entry, ...TIME_KEYS);
  if (t === null) return null;
  const m = /^(\d{4})-(\d{2})/.exec(String(t));
  if (!m) return null;
  return Date.UTC(+m[1], +m[2] - 1, 1);
}

function aktuellerMonatsstart() {
  const n = new Date();
  return Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), 1);
}

// ── Diagramm (SVG) ────────────────────────────────────────────────
const NS = "http://www.w3.org/2000/svg";

function se(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.append(e);
  return e;
}

function buildChart(points) {
  const W = 720, H = 320, L = 48, R = 16, T = 24, B = 48;
  const iw = W - L - R, ih = H - T - B;
  const n = points.length;

  const maxRaw = Math.max(...points.map(p => Math.max(p.y, p.hi ?? p.y)));
  const maxV = Math.max(maxRaw * 1.1, 10);
  const xAt = i => L + (n === 1 ? 0 : (i / (n - 1)) * iw);
  const yAt = v => T + ih - (v / maxV) * ih;

  const svg = se("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
                          "aria-label": "NOAA-Prognose SSN" });

  // Gitterlinien und Y-Achse
  for (let k = 0; k <= 4; k++) {
    const v = (maxV * k) / 4;
    se("line", { x1: L, x2: W - R, y1: yAt(v), y2: yAt(v),
                 stroke: "var(--border)", "stroke-width": 1 }, svg);
    const t = se("text", { x: L - 8, y: yAt(v) + 4, "text-anchor": "end" }, svg);
    t.textContent = Math.round(v);
  }

  // Prognosespanne
  if (points.every(p => p.lo !== null && p.hi !== null)) {
    const upper = points.map((p, i) => `${xAt(i)},${yAt(p.hi)}`);
    const lower = points.map((p, i) => `${xAt(i)},${yAt(p.lo)}`).reverse();
    se("polygon", { points: [...upper, ...lower].join(" "),
                    fill: "var(--accent)", "fill-opacity": 0.25 }, svg);
  }

  // Linie und Punkte
  se("polyline", {
    points: points.map((p, i) => `${xAt(i)},${yAt(p.y)}`).join(" "),
    fill: "none", stroke: "var(--blue)", "stroke-width": 2.2,
  }, svg);

  points.forEach((p, i) => {
    se("circle", { cx: xAt(i), cy: yAt(p.y), r: 4, fill: "var(--blue)" }, svg);
    const t = se("text", { x: xAt(i), y: yAt(p.y) - 9, "text-anchor": "middle" }, svg);
    t.textContent = Math.round(p.y);
  });

  // X-Achse: Monatsbeschriftung
  points.forEach((p, i) => {
    const d = new Date(p.ms);
    const t = se("text", { x: xAt(i), y: H - B + 18, "text-anchor": "middle" }, svg);
    t.textContent = `${MONATE_KURZ[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  });

  // Mini-Legende
  const lg = se("text", { x: W - R, y: 14, "text-anchor": "end" }, svg);
  lg.textContent = "Blau: Erwartete SSN  |  Gelb: NOAA-Prognosespanne";

  return svg;
}

// ── Abschnitte ────────────────────────────────────────────────────
async function kpAbschnitt(card) {
  let kp = null, zeit = "-", hist = null;
  for (const url of KP_URLS) {
    try {
      const data = await fetchJson(url);
      let eintraege = data;
      // Kopfzeile (Array mit Strings) überspringen
      if (Array.isArray(data) && Array.isArray(data[0]) &&
          !data[0].every(x => typeof x === "number")) {
        eintraege = data.slice(1);
      }
      for (let i = eintraege.length - 1; i >= 0; i--) {
        const [k, z] = extrahiereKp(eintraege[i]);
        if (k !== null && Number.isFinite(k) && k >= 0) { kp = k; zeit = z; break; }
      }
      if (kp !== null) { if (url === KP_URLS[0]) hist = eintraege; break; }
    } catch (_) { /* nächste URL probieren */ }
  }
  if (kp === null) throw new Error("Kein gültiger Kp-Wert gefunden.");

  const f = kpFarbe(kp);
  S.kp = { kp, f };
  card.append(
    row("Aktueller Kp-Wert", `${kp.toFixed(2)} / 9`, f),
    row("Messzeitraum", kpZeitfenster(zeit), "gray"),
    row("Hinweis", "Kp = Mittelwert des 3h-Blocks", "gray"),
    row("Aktivitätsstufe", kpStufe(kp), f),
    bar(kp / 9, f),
    scale("0", "9"),
  );

  card.append(el("div", "sub-plain", "Polarlichtsichtbarkeit in Deutschland"));
  for (const r of REGIONEN) {
    const mk = minKp(r.lat);
    const ok = kp >= mk;
    const line = el("div", "row");
    line.append(
      el("span", "label", r.name),
      el("span", "gray", `Benötigt Kp ≥ ${mk.toFixed(1)}  →  `),
      el("span", ok ? "green" : "gray", ok ? "[JA] Möglicherweise sichtbar" : "[NEIN] Nicht sichtbar"),
    );
    card.append(line);
  }
  if (hist) kpHistorie(card, hist);
}

function kpHistorie(card, eintraege) {
  const pts = eintraege.map(extrahiereKp).filter(([k]) => Number.isFinite(k) && k >= 0).slice(-24);
  if (pts.length < 2) return;
  card.append(el("div", "sub-plain", "Kp-Verlauf (letzte 72 Stunden, 3-h-Werte)"));
  const W = 720, H = 200, L = 30, T = 12, B = 26, iw = W - L - 10, ih = H - T - B, bw = iw / pts.length;
  const svg = se("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Kp-Verlauf" });
  for (let k = 0; k <= 9; k += 3) {
    const y = T + ih * (1 - k / 9);
    se("line", { x1: L, x2: W - 10, y1: y, y2: y, stroke: "var(--border)" }, svg);
    se("text", { x: L - 6, y: y + 4, "text-anchor": "end" }, svg).textContent = k;
  }
  pts.forEach(([k, z], i) => {
    const h = ih * Math.min(k, 9) / 9, x = L + i * bw;
    const r = se("rect", { x: x + 1, y: T + ih - h, width: bw - 2, height: Math.max(h, 1),
                           style: `fill:var(--${kpFarbe(k)})` }, svg);
    se("title", {}, r).textContent = `${String(z).slice(0, 16)} UTC: Kp ${k.toFixed(2)}`;
    if (i % 4 === 0) {
      const s = String(z).replace("T", " ");
      se("text", { x: x + bw / 2, y: H - 8, "text-anchor": "middle" }, svg).textContent =
        `${s.slice(8, 10)}.${s.slice(5, 7)}. ${s.slice(11, 13)}h`;
    }
  });
  card.append(svg);
}

async function f107Abschnitt(card) {
  const data = await fetchJson(F107_URL);
  // Erster Eintrag mit gültigem Flux-Wert (Liste ist absteigend sortiert)
  const letzter = data.find(e => Number(e.flux) > 0);
  if (!letzter) throw new Error("Kein gültiger F10.7-Wert gefunden.");

  const flux = Number(letzter.flux);
  const zeit = String(letzter.time_tag ?? "-").slice(0, 16).replace("T", " ");
  const schedule = letzter.reporting_schedule ?? "-";
  const mean90 = letzter.ninety_day_mean;
  const f = fluxFarbe(flux);
  S.f107 = { flux, f };

  card.append(
    row("F10.7 aktuell", `${flux.toFixed(1)} sfu`, f),
    row("Messung", schedule, "gray"),
    row("Zeitstempel (UTC)", zeit, "gray"),
    row("Aktivitätsstufe", fluxStufe(flux), f),
  );
  if (mean90 !== null && mean90 !== undefined) {
    const m = Number(mean90);
    if (m > 0) card.append(row("90-Tage-Mittel", `${m.toFixed(1)} sfu`, "cyan"));
  }

  // Skala 60–300 sfu
  const pct = Math.min(Math.max(flux - 60, 0), 240) / 240;
  card.append(bar(pct, f), scale("60", "300 sfu"));
}

async function ssnBeobachtetAbschnitt(card) {
  const d = await fetchJson(SSN_OBS_URL);

  let letzter = null;
  for (let i = d.length - 1; i >= 0; i--) {
    const v = getField(d[i], ...SSN_KEYS);
    if (v !== null && Number(v) >= 0) { letzter = d[i]; break; }
  }
  if (!letzter) letzter = d[d.length - 1];

  const zeitVal = getField(letzter, ...TIME_KEYS);
  const ssnVal = getField(letzter, ...SSN_KEYS);

  let smoothedFmt = null, smoothedEntry = null;
  for (let i = d.length - 1; i >= 0; i--) {
    const f = fmtSsn(getField(d[i], ...SMOOTH_KEYS));
    if (f !== null) { smoothedFmt = f; smoothedEntry = d[i]; break; }
  }
  const smoothedZeit = smoothedEntry ? getField(smoothedEntry, ...TIME_KEYS) : null;

  card.append(
    row("Bezugszeitraum", zeitVal ? String(zeitVal).slice(0, 7) : "-", "gray"),
    row("SSN (beobachtet)", fmtSsn(ssnVal) ?? "-", "yellow"),
  );

  if (smoothedFmt !== null) {
    const text = smoothedZeit
      ? `${smoothedFmt} (Stand: ${String(smoothedZeit).slice(0, 7)})`
      : smoothedFmt;
    card.append(row("SSN (geglättet)", text, "cyan"));
  } else {
    card.append(row("SSN (geglättet)", "noch nicht verfügbar", "gray"));
    const ab = zeitVal ? verfuegbarAb(zeitVal) : "ca. in 6 Monaten";
    card.append(
      el("p", "hint", "Hinweis: Die geglättete SSN wird mit einer 13-Monats-Mittlung berechnet und benötigt 6 Monate Zukunftsdaten."),
      el("p", "hint", `Für ${zeitVal ? String(zeitVal).slice(0, 7) : "-"} wird sie erst ab ${ab} vorliegen.`),
    );
  }
}

async function ssnPrognoseAbschnitt(card) {
  const d = await fetchJson(SSN_PRED_URL);
  const start = aktuellerMonatsstart();

  // Erster Eintrag ab aktuellem Monat
  const n = d.find(e => {
    const ms = monatsDatum(e);
    return ms !== null && ms >= start;
  });

  if (n) {
    const sv = getField(n, ...PRED_KEYS);
    const low = n.low_ssn ?? null;
    const high = n.high_ssn ?? null;
    const t = getField(n, ...TIME_KEYS);

    card.append(el("div", "sub", "Vorhersage (SSNe)"));
    card.append(row("Vorhersagemonat", t ? String(t).slice(0, 7) : "-", "gray"));
    if (sv !== null) {
      const spanne = (low !== null && high !== null)
        ? `${Number(sv).toFixed(0)}  (Spanne: ${Number(low).toFixed(0)} - ${Number(high).toFixed(0)})`
        : Number(sv).toFixed(0);
      card.append(row("SSNe (erwartet)", spanne, "yellow"));
      card.append(row("Aktivitätsniveau", ssnNiveau(Number(sv)), "yellow"));
    }
  }

  // Diagramm: nächste 12 Monate
  const points = d
    .map(e => {
      const ms = monatsDatum(e);
      const y = Number(getField(e, ...PRED_KEYS));
      const lo = getField(e, "low_ssn", "predicted_ssn_low", "low");
      const hi = getField(e, "high_ssn", "predicted_ssn_high", "high");
      return {
        ms, y,
        lo: lo === null ? null : Number(lo),
        hi: hi === null ? null : Number(hi),
      };
    })
    .filter(p => p.ms !== null && !Number.isNaN(p.y) && p.ms >= start)
    .sort((a, b) => a.ms - b.ms)
    .slice(0, 12)
    .map(p => ({
      ...p,
      lo: p.lo !== null && !Number.isNaN(p.lo) ? p.lo : null,
      hi: p.hi !== null && !Number.isNaN(p.hi) ? p.hi : null,
    }));

  if (points.length < 2) {
    throw new Error("Zu wenige NOAA-Prognosewerte für eine Grafik gefunden.");
  }

  card.append(el("div", "sub", "NOAA-Prognose der Sonnenfleckenrelativzahl (nächste 12 Monate)"));
  card.append(buildChart(points));
  card.append(row("Prognosezeitraum", `${points.length} Monate`, "gray"));
}

// ── GOES X-Ray Flux ───────────────────────────────────────────────
const XRAY_LANG = "0.1-0.8nm";   // langwelliger Kanal (Flare-Klassifikation)
const XRAY_KURZ = "0.05-0.4nm";  // kurzwelliger Kanal
const SUP = ["⁰","¹","²","³","⁴","⁵","⁶","⁷","⁸","⁹"];
const XRAY_KLASSEN = [
  { k: "A", lo: 1e-8, farbe: "cyan" },
  { k: "B", lo: 1e-7, farbe: "green" },
  { k: "C", lo: 1e-6, farbe: "yellow" },
  { k: "M", lo: 1e-5, farbe: "magenta" },
  { k: "X", lo: 1e-4, farbe: "red" },
];

function xrayKlasse(f) {
  let kl = XRAY_KLASSEN[0];
  for (const c of XRAY_KLASSEN) if (f >= c.lo) kl = c;
  return { ...kl, text: kl.k + (f / kl.lo).toFixed(1) };
}

function fmtFlux(f) {
  const [m, e] = f.toExponential(2).split("e");
  const ex = Number(e);
  const sup = String(Math.abs(ex)).split("").map(d => SUP[d]).join("");
  return `${m} × 10${ex < 0 ? "⁻" : ""}${sup} W/m²`;
}

function xrayStufe(k) {
  return { A: "Ruhig (A-Klasse)", B: "Ruhig (B-Klasse)",
           C: "Geringe Flare-Aktivität (C-Klasse)",
           M: "Mäßige Flare-Aktivität (M-Klasse)",
           X: "Starke Flare-Aktivität (X-Klasse)" }[k];
}

function radioBlackout(f) {
  if (f >= 2e-3) return "R5 - Extremer Radio-Blackout";
  if (f >= 1e-3) return "R4 - Schwerer Radio-Blackout";
  if (f >= 1e-4) return "R3 - Starker Radio-Blackout";
  if (f >= 5e-5) return "R2 - Mäßiger Radio-Blackout";
  if (f >= 1e-5) return "R1 - Geringer Radio-Blackout";
  return "Kein Radio-Blackout";
}

function utcHm(ms) {
  const d = new Date(ms);
  return pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes());
}

function xrayPfad(serie, xAt, yAt) {
  let d = "", prev = null;
  for (const p of serie) {
    d += (prev === null || p.t - prev > 5 * 60e3 ? "M" : "L") +
         xAt(p.t).toFixed(1) + "," + yAt(p.v).toFixed(1);
    prev = p.t;
  }
  return d;
}

// Logarithmisches 24-h-Diagramm im Stil von SolarHam / NOAA SWPC
function buildXrayChart(lang, kurz, t0, t1, sat, flares, stepH) {
  const W = 720, H = 360, L = 60, R = 34, T = 30, B = 46;
  const iw = W - L - R, ih = H - T - B;
  const LMIN = -9, LMAX = -3;
  const xAt = t => L + ((t - t0) / (t1 - t0)) * iw;
  const yAt = v => {
    const lv = Math.min(Math.max(Math.log10(v), LMIN), LMAX);
    return T + ih * (1 - (lv - LMIN) / (LMAX - LMIN));
  };

  const svg = se("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
                          "aria-label": `GOES-${sat} Röntgenfluss der letzten 24 Stunden` });

  // Farbige Klassenbänder (A bis X) + Klassenbuchstaben rechts
  XRAY_KLASSEN.forEach(c => {
    const yTop = yAt(c.lo * 10), yBot = yAt(c.lo);
    se("rect", { x: L, y: yTop, width: iw, height: yBot - yTop,
                 style: `fill:var(--${c.farbe})`, "fill-opacity": 0.09 }, svg);
    const t = se("text", { x: W - R + 12, y: (yTop + yBot) / 2 + 5, "text-anchor": "middle",
                           style: `fill:var(--${c.farbe});font-size:15px;font-weight:700` }, svg);
    t.textContent = c.k;
  });

  // Horizontale Gitterlinien je Dekade + Achsenbeschriftung
  for (let e = LMIN; e <= LMAX; e++) {
    const y = yAt(Math.pow(10, e));
    se("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: "var(--border)", "stroke-width": 1 }, svg);
    const t = se("text", { x: L - 8, y: y + 4, "text-anchor": "end" }, svg);
    t.textContent = "10" + (e < 0 ? "⁻" : "") + String(Math.abs(e)).split("").map(d => SUP[d]).join("");
  }
  const yl = se("text", { x: 13, y: T + ih / 2, "text-anchor": "middle",
                          transform: `rotate(-90 13 ${T + ih / 2})` }, svg);
  yl.textContent = "Watt pro m²";

  // Vertikale Gitterlinien alle 3 Stunden (UTC)
  const step = stepH * 3600e3;
  for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) {
    const x = xAt(t);
    const d = new Date(t);
    const mitternacht = d.getUTCHours() === 0;
    se("line", { x1: x, x2: x, y1: T, y2: T + ih,
                 stroke: mitternacht ? "var(--muted)" : "var(--border)",
                 "stroke-width": 1, "stroke-dasharray": mitternacht ? "" : "3 3" }, svg);
    const tx = se("text", { x, y: T + ih + 16, "text-anchor": "middle" }, svg);
    tx.textContent = utcHm(t);
    if (mitternacht) {
      const dx = se("text", { x, y: T + ih + 30, "text-anchor": "middle" }, svg);
      dx.textContent = `${pad(d.getUTCDate())}.${pad(d.getUTCMonth() + 1)}.`;
    }
  }
  const xl = se("text", { x: L + iw, y: H - 4, "text-anchor": "end" }, svg);
  xl.textContent = "UTC";

  // Messkurven: kurz (blau) unten, lang (rot) darüber
  se("path", { d: xrayPfad(kurz, xAt, yAt), fill: "none", stroke: "var(--blue)",
               "stroke-width": 1.4, "stroke-linejoin": "round" }, svg);
  se("path", { d: xrayPfad(lang, xAt, yAt), fill: "none", stroke: "var(--red)",
               "stroke-width": 1.6, "stroke-linejoin": "round" }, svg);

  // Rahmen
  se("rect", { x: L, y: T, width: iw, height: ih, fill: "none",
               stroke: "var(--muted)", "stroke-width": 1 }, svg);

  // Legende oben
  se("line", { x1: L, x2: L + 22, y1: 14, y2: 14, stroke: "var(--red)", "stroke-width": 2.5 }, svg);
  const l1 = se("text", { x: L + 28, y: 18 }, svg);
  l1.textContent = "0.1-0.8 nm (lang)";
  se("line", { x1: L + 150, x2: L + 172, y1: 14, y2: 14, stroke: "var(--blue)", "stroke-width": 2.5 }, svg);
  const l2 = se("text", { x: L + 178, y: 18 }, svg);
  l2.textContent = "0.05-0.4 nm (kurz)";
  const l3 = se("text", { x: W - R, y: 18, "text-anchor": "end" }, svg);
  l3.textContent = `GOES-${sat} X-Ray Flux, ${Math.round((t1 - t0) / 3600e3)} h`;

  // M-/X-Flares markieren
  flares.forEach(f => {
    const x = xAt(f.t), y = yAt(f.v);
    se("circle", { cx: x, cy: y, r: 4, fill: "none", stroke: "var(--text)", "stroke-width": 1.5 }, svg);
    se("text", { x, y: y - 8, "text-anchor": "middle", style: "fill:var(--text);font-weight:700" }, svg).textContent = f.k;
  });

  // Fadenkreuz + Wertanzeige (Maus/Touch)
  const cur = se("line", { y1: T, y2: T + ih, stroke: "var(--text)", "stroke-width": 1, visibility: "hidden" }, svg);
  const tip = el("div", "hint", "Über das Diagramm fahren bzw. tippen, um Werte anzuzeigen.");
  const wrap = el("div");
  wrap.append(svg, tip);
  const nah = (arr, t) => arr.reduce((a, b) => (Math.abs(b.t - t) < Math.abs(a.t - t) ? b : a), arr[0]);
  const zeig = ev => {
    const r = svg.getBoundingClientRect();
    const x = (ev.clientX - r.left) / r.width * W;
    if (x < L || x > W - R) return;
    const t = t0 + (x - L) / iw * (t1 - t0);
    const a = nah(lang, t);
    if (Math.abs(a.t - t) > 10 * 60e3) { tip.textContent = "Keine Daten"; return; }
    cur.setAttribute("x1", xAt(a.t)); cur.setAttribute("x2", xAt(a.t));
    cur.setAttribute("visibility", "visible");
    const b = kurz.length ? nah(kurz, a.t) : null;
    const lokal = new Date(a.t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    tip.textContent = `${utcHm(a.t)} UTC (${lokal} lokal) - lang: ${xrayKlasse(a.v).text} (${fmtFlux(a.v)})` +
                      (b ? ` - kurz: ${fmtFlux(b.v)}` : "");
  };
  // Touch: horizontales Wischen gehört dem Diagramm, vertikales Scrollen bleibt der Seite
  svg.style.touchAction = "pan-y";
  svg.style.userSelect = "none";
  svg.addEventListener("pointermove", zeig);
  svg.addEventListener("pointerdown", ev => {
    try { svg.setPointerCapture(ev.pointerId); } catch (_) { /* nicht kritisch */ }
    zeig(ev);
  });
  return wrap;
}

async function xrayAbschnitt(card) {
  const [datei, hrs, stepH] = RANGES[xrayRange];
  const tabs = el("div", "tabs");
  for (const k in RANGES) {
    const b = el("button", k === xrayRange ? "on" : "", k);
    b.type = "button";
    b.onclick = () => {
      xrayRange = k;
      card.replaceChildren(card.firstChild);
      xrayAbschnitt(card).catch(e => card.append(el("div", "err", "[FEHLER] " + e.message)));
    };
    tabs.append(b);
  }
  card.append(tabs);
  const flareP = fetchJson(FLARE_URL).catch(() => []);
  const res = await Promise.allSettled(XRAY_URLS.map(u => fetchJson(u.replace("1-day", datei))));
  const quellen = res
    .filter(r => r.status === "fulfilled" && Array.isArray(r.value) && r.value.length)
    .map(r => r.value);
  if (!quellen.length) throw new Error("Keine GOES-Röntgendaten abrufbar.");

  const satOf = d => {
    const e = d.find(x => x.satellite !== undefined && x.satellite !== null);
    return e ? Number(e.satellite) : null;
  };
  let daten = quellen.find(d => satOf(d) === XRAY_SATELLIT);
  let sat = XRAY_SATELLIT;
  const fallback = !daten;
  if (fallback) { daten = quellen[0]; sat = satOf(daten) ?? "?"; }

  const t1 = Date.now(), t0 = t1 - hrs * 3600e3;
  const serie = energie => daten
    .filter(e => e.energy === energie)
    .map(e => ({ t: Date.parse(e.time_tag), v: Number(e.flux) }))
    .filter(p => Number.isFinite(p.t) && p.t >= t0 && Number.isFinite(p.v) && p.v > 0)
    .sort((a, b) => a.t - b.t);

  const lang = serie(XRAY_LANG), kurz = serie(XRAY_KURZ);
  if (!lang.length) throw new Error("Keine gültigen Röntgenflusswerte gefunden.");

  const flares = (await flareP).filter(f => /^[MX]/.test(f.max_class || ""))
    .map(f => ({ t: Date.parse(f.max_time), v: Number(f.max_xrlong), k: f.max_class }))
    .filter(f => f.t >= t0 && f.t <= t1 && f.v > 0);
  const jetzt = lang[lang.length - 1];
  const max = lang.reduce((a, b) => (b.v > a.v ? b : a));
  const kJetzt = xrayKlasse(jetzt.v), kMax = xrayKlasse(max.v);
  S.xray = { text: kJetzt.text, farbe: kJetzt.farbe };
  const maxTag = new Date(max.t);

  S.xray = null;
  card.append(
    row("Satellit", `GOES-${sat}`, "gray"),
    row("Zeitstempel (UTC)", new Date(jetzt.t).toISOString().slice(0, 16).replace("T", " "), "gray"),
    row("Aktuell (0.1-0.8 nm)", `${kJetzt.text}  (${fmtFlux(jetzt.v)})`, kJetzt.farbe),
  );
  if (kurz.length) {
    card.append(row("Aktuell (0.05-0.4 nm)", fmtFlux(kurz[kurz.length - 1].v), "blue"));
  }
  card.append(
    row(`Maximum (${hrs} h)`,
        `${kMax.text}  um ${utcHm(max.t)} UTC (${pad(maxTag.getUTCDate())}.${pad(maxTag.getUTCMonth() + 1)}.)`,
        kMax.farbe),
    row("Aktivitätsstufe", xrayStufe(kJetzt.k), kJetzt.farbe),
    row("Radio-Blackout (24-h-Max.)", radioBlackout(max.v), kMax.farbe),
  );
  if (fallback) {
    card.append(el("p", "hint",
      `Hinweis: Für GOES-${XRAY_SATELLIT} liegen im NOAA-Feed derzeit keine Daten vor; ` +
      `angezeigt werden die Daten von GOES-${sat}.`));
  }
  card.append(buildXrayChart(lang, kurz, t0, t1, sat, flares, stepH));
}

async function windAbschnitt(card) {
  const [p, m, pr] = await Promise.allSettled([fetchJson(PLASMA_URL), fetchJson(MAG_URL), fetchJson(PROTON_URL)]);
  const letzte = (r, i) => {
    if (r.status !== "fulfilled") return null;
    const d = r.value.slice(1);
    for (let k = d.length - 1; k >= 0; k--) {
      const v = parseFloat(d[k][i]);
      if (Number.isFinite(v)) return { v, t: String(d[k][0]).slice(0, 16) };
    }
    return null;
  };
  const dichte = letzte(p, 1), speed = letzte(p, 2), bz = letzte(m, 3), bt = letzte(m, 6);
  let proton = null;
  if (pr.status === "fulfilled") {
    const e = pr.value.filter(x => x.energy === ">=10 MeV" && Number(x.flux) >= 0);
    if (e.length) proton = { v: Number(e[e.length - 1].flux), t: String(e[e.length - 1].time_tag).slice(0, 16).replace("T", " ") };
  }
  if (!speed && !bz && !proton) throw new Error("Keine Solarwind-/Protonendaten abrufbar.");
  if (speed) {
    const f = speed.v >= 700 ? "red" : speed.v >= 500 ? "yellow" : "green";
    card.append(row("Windgeschwindigkeit", `${speed.v.toFixed(0)} km/s`, f));
  }
  if (dichte) card.append(row("Teilchendichte", `${dichte.v.toFixed(1)} p/cm³`, "cyan"));
  if (bz) {
    const f = bz.v <= -10 ? "red" : bz.v <= -5 ? "yellow" : "green";
    card.append(row("Bz (GSM)", `${bz.v.toFixed(1)} nT${bz.v < 0 ? "  (südwärts, polarlichtfördernd)" : ""}`, f));
  }
  if (bt) card.append(row("Bt (Gesamtfeld)", `${bt.v.toFixed(1)} nT`, "cyan"));
  if (speed) card.append(row("Zeitstempel (UTC)", speed.t.replace("T", " "), "gray"));
  if (proton) {
    const f = proton.v >= 10 ? "red" : proton.v >= 1 ? "yellow" : "green";
    card.append(row("Protonenfluss >= 10 MeV", `${proton.v.toFixed(2)} pfu`, f),
      row("Strahlungssturm", proton.v >= 10 ? "S1 oder höher (Schwelle 10 pfu)" : "Keiner (S0)", f));
  }
  if (speed || bz) S.wind = `${speed ? speed.v.toFixed(0) + " km/s" : ""}${speed && bz ? ", " : ""}${bz ? "Bz " + bz.v.toFixed(1) + " nT" : ""}`;
}

function zusammenfassung(card) {
  card.append(el("h2", "", "Auf einen Blick"));
  if (S.kp) card.append(row("Geomagnetik", `Kp ${S.kp.kp.toFixed(1)}`, S.kp.f));
  if (S.xray) card.append(row("Röntgenfluss (GOES)", S.xray.text, S.xray.farbe));
  if (S.wind) card.append(row("Solarwind", S.wind, "cyan"));
  if (S.f107) card.append(row("F10.7", `${S.f107.flux.toFixed(0)} sfu`, S.f107.f));
  if (S.kp) {
    const ok = S.kp.kp >= minKp(53.5);
    card.append(row("Polarlicht", ok ? "In Norddeutschland möglich" : "In Deutschland derzeit unwahrscheinlich", ok ? "green" : "gray"));
  }
}

function magnetogrammAbschnitt(card) {
  const url = "http://www.dk0wcy.de/magnetogram/";
  card.append(el("p", "hint", "Minutengenaue Aufzeichnung des Erdmagnetfelds, Station DK0WCY bei Kiel. " +
    "Die Seite ist nur per http erreichbar und lässt sich daher nicht sicher einbetten."));
  const link = el("a", "hint", "Magnetogramm in neuem Fenster öffnen");
  link.href = url; link.target = "_blank"; link.rel = "noopener";
  card.append(link);
}

function legendeAbschnitt(card) {
  const text = [
    "Kp 0-1 → Ruhig             Kp 5   → G1-Sturm (Polarlicht ca. 60 Grad N)",
    "Kp 2-3 → Leicht unruhig    Kp 6   → G2-Sturm (Polarlicht ca. 55 Grad N)",
    "Kp 4   → Aktiv             Kp 7-9 → G3-G5    (Polarlicht < 50 Grad N)",
    "",
    "F10.7 (sfu): < 80 ruhig | 80-100 leicht | 100-120 moderat",
    "             120-150 erhöht | 150-200 hoch | > 200 sehr hoch",
    "",
    "X-Ray (GOES, W/m2): A < 1e-7 | B 1e-7 bis 1e-6 | C 1e-6 bis 1e-5",
    "                    M 1e-5 bis 1e-4 | X >= 1e-4 (Flare-Klassen)",
    "                    M1 = R1, M5 = R2, X1 = R3, X10 = R4, X20 = R5 (Radio-Blackout)",
    "",
    "SSN  = Beobachtete Sonnenfleckenrelativzahl (Wolf-Zahl)",
    "SSNe = Erwartete Sonnenfleckenrelativzahl (NOAA-Vorhersage)",
    "Gegl. SSN = 13-Monats-Mittel, verzögert um ~6 Monate",
    "",
    "Quelle: NOAA Space Weather Prediction Center (swpc.noaa.gov)",
  ].join("\n");
  card.append(el("p", "legend", text));
}

// ── Hauptablauf ───────────────────────────────────────────────────
let gen = 0;   // Laufnummer: ein neuer Ladevorgang macht ältere ungültig
async function laden(manuell = false) {
  const mein = ++gen;
  const btn = document.getElementById("reload");
  btn.textContent = "Lade …";
  try {
    const content = document.getElementById("content");
    const y = window.scrollY;
    for (const k in S) delete S[k];
    document.getElementById("stamp").textContent =
      `Abgerufen: ${new Date().toISOString().slice(0, 16).replace("T", " ")} UTC · Auto-Update alle 2 Min.`;

    const specs = [
      ["Kp-Index (Geomagnetischer Aktivitätsindex)", kpAbschnitt],
      ["Penticton 10.7cm Solar Flux (F10.7)", f107Abschnitt],
      ["GOES-18 X-Ray Flux", xrayAbschnitt],
      ["Solarwind und Protonenfluss", windAbschnitt],
      ["Sonnenfleckenrelativzahl (SSN / SSNe)", ssnBeobachtetAbschnitt],
      ["Sonnenfleckenvorhersage (SSNe)", ssnPrognoseAbschnitt],
      ["Magnetogramm DK0WCY (Kiel)", magnetogrammAbschnitt],
      ["Legende", legendeAbschnitt],
    ];
    const nc = el("div");
    const sum = el("section", "card");
    nc.append(sum);
    const cards = specs.map(([titel]) => {
      const c = el("section", "card");
      c.append(el("h2", "", titel));
      nc.append(c);
      return c;
    });
    // Beim ersten Laden erscheinen die Karten sofort und füllen sich nach und nach;
    // bei Aktualisierungen wird der fertige Inhalt in einem Zug getauscht (kein Flackern).
    if (manuell === true) content.replaceChildren();   // sichtbare Reaktion auf den Klick
    const erstes = !content.hasChildNodes();
    sum.append(el("h2", "", "Auf einen Blick"), el("p", "hint", "Daten werden geladen …"));
    if (erstes) content.append(...nc.childNodes);
    await Promise.all(specs.map(async ([, fn], i) => {
      const ph = el("p", "hint", "Lade …");
      cards[i].append(ph);
      try {
        await Promise.race([fn(cards[i]),
          new Promise((_, rej) => setTimeout(() => rej(new Error("Zeitüberschreitung")), 30000))]);
      } catch (e) { cards[i].append(el("div", "err", "[FEHLER] " + e.message)); }
      ph.remove();
    }));
    if (mein !== gen) return;   // inzwischen neuerer Ladevorgang
    sum.replaceChildren();
    zusammenfassung(sum);
    if (!erstes) { content.replaceChildren(...nc.childNodes); window.scrollTo(0, y); }
  } finally {
    if (mein === gen) { btn.textContent = "Aktualisieren"; }
  }
}

document.getElementById("reload").addEventListener("click", () => laden(true));
laden();
setInterval(laden, 120000);
</script>
